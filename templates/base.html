{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            {% block title %} {{ title }} {% endblock %}
        </title>
        <!-- =====FAB ICON======= -->
        <link rel="stylesheet" href="{% static 'vexon/css/magnific-popup.css' %}" />
        <link rel="stylesheet" href="{% static 'vexon/css/utility.css' %}" />

        <link rel="stylesheet" href="{% static 'vexon/css/main.css' %}" />
        <link rel="stylesheet" href="{% static 'vexon/css/mobile-menu.css' %}" />

        <link rel="shortcut icon" href="{% static 'vexon/img/logo/cdnews.svg' %}" type="image/x-icon" />

        <!-- HTMX -->
        <script src="https://unpkg.com/htmx.org@1.9.6"></script>
        <!-- Prism para highlight de código -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-dark.min.css" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

        <!-- Tabler CSS -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler-flags.min.css" />
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler-payments.min.css" />
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler-social.min.css" />
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler-vendors.min.css" />
        <!-- Tabler Icons -->
        <link rel="stylesheet" 
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
        
        <link rel="stylesheet" href="{% static 'vexon/css/important_styles.css' %}" />
    
        <!-- =====JQUERY======= -->
        <script src="https://code.jquery.com/jquery-3.7.1.js" 
            integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
            crossorigin="anonymous"></script>

    </head>
    <body>
        <div class="page">
            <div class="sticky-top">
                <!-- =====HEADER====== -->
                {% include 'partials/header.html'%}
            </div>
            <main class="page-wrapper">
                <!-- =====CONTENT======-->
                {% block content %} {{ content}} {% endblock %}
            </main>
            <footer>
                <!-- =====FOOTER======-->
                {% include 'partials/footer.html'%}
            </footer>
        </div>
    </body>
    <script
        src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js">
    </script>
</html>
