{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        {{ title }}
      {% endblock %}
    </title>
    <!-- =====FAB ICON======= -->
    <link rel="stylesheet" href="{% static 'vexon/css/magnific-popup.css' %}" />
    <link rel="stylesheet" href="{% static 'vexon/css/utility.css' %}" />

    <link rel="stylesheet" href="{% static 'vexon/css/main.css' %}" />
    <link rel="stylesheet" href="{% static 'vexon/css/mobile-menu.css' %}" />

    <link rel="shortcut icon" href="{% static 'vexon/img/logo/cdnews.svg' %}" type="image/x-icon" />

    <!-- Tabler CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler-flags.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler-payments.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler-social.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler-vendors.min.css" />
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

    <link rel="stylesheet" href="{% static 'vexon/css/important_styles.css' %}" />

    <!-- =====JQUERY======= -->
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <!-- Prism para highlight de código -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-dark.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

     <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <!-- =====TIPOGRAFÍA======= -->
    <style>
      :root {
        --tblr-font-sans-serif: "Figtree", sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="page-wrapper">
        <section class="h-screen w-full">
            <div class="row g-0 flex-fill">
              <div class="col-12 col-lg-6 col-xl-5 border-top-wide border-primary d-flex flex-column justify-content-center">
                <div class="container container-tight my-5 px-lg-5">
                <div class="text-center mb-4">
                  <a href="{% url 'core:home' %}">
                    <img src="{% static 'vexon/img/logo/cdnews.png' %}" class="navbar-brand-image" alt="codenews" style="height: 70px;">
                  </a>
                </div>

                  {% block content %}
                    {{ content }}
                  {% endblock %}
                </div>
              </div>
              <div class="col-12 col-lg-6 col-xl-7 d-none d-lg-block">
                <!-- Photo -->
                <div class="bg-cover h-100 min-vh-100" style="background-image: url('{% static 'vexon/img/logo/codenews_banner.webp' %}'); transform: scaleX(-1);"></div>
              </div>
            </div>
        </section>
      </main>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
</html>
