<h1>CodeNews</h1>

<h2>Usuario: {{ request.user.username }}</h2>
<a href="{% url 'users:login' %}">Iniciar sesión</a>
<a href="{% url 'users:register' %}">Registrarse</a>
<a href="{% url 'users:change_password' %}">Cambiar contraseña</a>

{% if request.user.is_authenticated %}
    <a href="{% url 'users:profile' %}">Perfil de Usuario</a>
    <form method="post" action="{% url 'users:logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
    </form>
{% endif %}
